name: Sync YouTube Videos

on:
  schedule:
    # Runs every Monday at 9:30 AM UTC
    - cron: '30 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch new videos from YouTube
        env:
          YT_CHANNEL_ID: 'UCfS1fysgTvYIQ7lI4OjFGMw'
        run: node scripts/sync-youtube-videos.js

      - name: Rebuild ROI TV page
        run: node scripts/build-roitv-html.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/roitv.json roi-tv/index.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/roitv.json roi-tv/index.html
          git commit -m "chore: sync videos from YouTube [automated]"
          git push
